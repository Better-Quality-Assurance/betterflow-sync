name: Sync Downloads Metadata

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional release tag to sync manually, for example v1.4.2
        required: false
        type: string

# Read-only token: this workflow only reads release metadata and POSTs to the
# downloads backend with its own secret; it never needs to write to the repo.
permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve release payload
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          TAG="${EVENT_TAG:-}"
          if [ -z "${TAG}" ]; then
            TAG="${INPUT_RELEASE_TAG:-}"
          fi
          if [ -z "${TAG}" ]; then
            echo "No release tag from event payload or manual release_tag input" >&2
            exit 1
          fi

          # Always fetch the release fresh from the API and poll until every
          # platform installer is attached. The `release: published` event can
          # fire before the build matrix finishes uploading the per-platform
          # DMGs/ZIP, so a one-shot read of the event payload races the upload
          # (this is why every prior sync run failed). Retry until complete.
          attempts=0
          max_attempts=30          # 30 * 20s = up to 10 minutes
          while : ; do
            gh api "repos/${REPO}/releases/tags/${TAG}" > release.json

            jq -e '
              {
                version: (.tag_name | sub("^v"; "")),
                tag_name: .tag_name,
                release_name: (.name // .tag_name),
                published_at: (.published_at // .created_at),
                release_url: .html_url,
                changelog_markdown: (.body // ""),
                macos_arm64_url: ([.assets[] | select(.name == "BetterFlow-macOS-arm64.dmg") | .browser_download_url] | first // ""),
                macos_x64_url: ([.assets[] | select(.name == "BetterFlow-macOS-x86_64.dmg") | .browser_download_url] | first // ""),
                windows_url: ([.assets[] | select(.name == "BetterFlow-Windows-Setup.exe") | .browser_download_url] | first // "")
              }
            ' release.json > payload.json

            if jq -e '
              (.version | length) > 0 and
              (.published_at | length) > 0 and
              (.release_url | length) > 0 and
              (.release_name | length) > 0 and
              (.macos_arm64_url | length) > 0 and
              (.macos_x64_url | length) > 0 and
              (.windows_url | length) > 0
            ' payload.json > /dev/null; then
              echo "All platform assets present for ${TAG}."
              break
            fi

            attempts=$((attempts + 1))
            if [ "${attempts}" -ge "${max_attempts}" ]; then
              echo "Timed out waiting for all platform assets on ${TAG}" >&2
              echo "--- last payload.json ---" >&2
              cat payload.json >&2
              exit 1
            fi
            echo "Not all platform assets present yet for ${TAG} (attempt ${attempts}/${max_attempts}); retrying in 20s..."
            sleep 20
          done

          {
            echo "version=$(jq -r '.version' payload.json)"
            echo "tag_name=$(jq -r '.tag_name' payload.json)"
          } >> "${GITHUB_OUTPUT}"

      - name: Sync release metadata to backend
        env:
          BACKEND_URL: ${{ secrets.DOWNLOADS_SYNC_BACKEND_URL }}
          RELEASE_SYNC_TOKEN: ${{ secrets.DOWNLOADS_SYNC_TOKEN }}
        run: |
          set -euo pipefail

          # FAIL, do not skip. This step used to emit a ::warning:: and exit 0
          # when the secrets were absent, on the reasoning that the sync is
          # "optional automation". The result was a green run that synced
          # nothing, on every release, for 18 releases: the download page sat
          # on v1.5.104 while v1.5.122 was live (#183). A green check is a
          # claim that the page was updated, and nobody re-checks a claim.
          #
          # That silence had a second cost. New machines install whatever the
          # page advertises, so they got v1.5.104 — which predates the Rosetta
          # preflight added in v1.5.118. An Apple Silicon Mac therefore
          # recorded zero time with no warning at all, instead of being told to
          # run softwareupdate --install-rosetta (#188, ~90 minutes lost on
          # 2026-08-13). The stale page was not cosmetic; it withheld the fix.
          #
          # A red run here cannot block a release: this workflow is triggered
          # by `release: published` and nothing depends on it. Red is exactly
          # the signal that was missing.
          if [ -z "${BACKEND_URL:-}" ] || [ -z "${RELEASE_SYNC_TOKEN:-}" ]; then
            echo "::error::Downloads sync NOT performed — the download page still advertises the previous version. Set the DOWNLOADS_SYNC_BACKEND_URL and DOWNLOADS_SYNC_TOKEN repository secrets (and the backend AGENT_RELEASE_SYNC_TOKEN env)." >&2
            exit 1
          fi

          curl --fail --show-error --silent \
            -X POST \
            "${BACKEND_URL%/}/api/internal/releases/desktop" \
            -H "Content-Type: application/json" \
            -H "X-Release-Token: ${RELEASE_SYNC_TOKEN}" \
            --data @payload.json

      - name: Upload payload for debugging
        uses: actions/upload-artifact@v7
        with:
          name: downloads-sync-payload-${{ steps.release.outputs.tag_name || github.run_id }}
          path: payload.json
          retention-days: 7
