name: Build Desktop App

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least-privilege by default: build/test jobs only read. The release job opts up
# to contents: write below. Pins the token so it never inherits a read-write org
# default (defense-in-depth, esp. against any future pull_request_target change).
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target_arch: arm64
            artifact_name: BetterFlow.app
            asset_name: BetterFlow-macOS-arm64
            package_type: dmg
          - os: macos-14-large
            target_arch: x86_64
            artifact_name: BetterFlow.app
            asset_name: BetterFlow-macOS-x86_64
            package_type: dmg
          - os: windows-latest
            target_arch: ''
            artifact_name: BetterFlow
            asset_name: BetterFlow-Windows
            package_type: zip
          - os: ubuntu-latest
            target_arch: ''
            artifact_name: BetterFlow
            asset_name: BetterFlow-linux-x86_64
            package_type: AppImage

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # PyGObject (AppIndicator tray backend) is built from source by pip and
      # needs GObject-introspection + cairo dev headers; libnotify-bin provides
      # notify-send at runtime; the AppIndicator typelib is bundled by PyInstaller.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgirepository1.0-dev gir1.2-gtk-3.0 gir1.2-ayatanaappindicator3-0.1 \
            libcairo2-dev pkg-config python3-dev libnotify-bin

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Generate icons
        run: python scripts/generate_icons.py

      - name: Download ActivityWatch binaries
        run: python scripts/download_aw.py

      - name: Build with PyInstaller
        run: pyinstaller build.spec --clean
        env:
          TARGET_ARCH: ${{ matrix.target_arch }}
          # Baked into _build_secrets.py by build.spec so the shipped app reports
          # in-app errors/crashes. Without this the error reporter is a no-op.
          BETTERFLOW_ERROR_DSN: ${{ secrets.BETTERFLOW_ERROR_DSN }}
          BETTERFLOW_ERROR_ENDPOINT: ${{ secrets.BETTERFLOW_ERROR_ENDPOINT }}

      - name: List dist contents (macOS)
        if: runner.os == 'macOS'
        run: ls -la dist/

      - name: List dist contents (Windows)
        if: matrix.os == 'windows-latest'
        run: dir dist

      - name: List dist contents (Linux)
        if: runner.os == 'Linux'
        run: ls -la dist/

      # Developer ID-sign the .app before packaging. No-op until the
      # MACOS_CERT_P12_BASE64 secret is set; on tagged releases signing is
      # REQUIRED (an unsigned tag fails the build). Imports the cert into a
      # throwaway keychain so scripts/sign-mac.sh's `security find-identity`
      # resolves the Developer ID identity, then signs inside-out.
      - name: Sign macOS app
        if: runner.os == 'macOS'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${MACOS_CERT_P12_BASE64:-}" ]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::MACOS_CERT_P12_BASE64 not set — refusing to ship an unsigned tagged release."
              exit 1
            fi
            echo "MACOS_CERT_P12_BASE64 not set — skipping macOS signing (ad-hoc build)."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/betterflow-signing.keychain-db"
          KEYCHAIN_PASS="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          CERT_PATH="$RUNNER_TEMP/betterflow-devid.p12"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "${MACOS_CERT_PASSWORD:-}" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Allow codesign to use the imported key non-interactively.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASS" "$KEYCHAIN" >/dev/null
          # Prepend our keychain to the search list so find-identity sees the cert.
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | sed 's/"//g')
          rm -f "$CERT_PATH"
          ./scripts/sign-mac.sh dist/BetterFlow.app

      - name: Create macOS DMG
        if: runner.os == 'macOS'
        run: |
          brew install create-dmg
          create-dmg \
            --volname "BetterFlow" \
            --volicon "resources/icon.icns" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "BetterFlow.app" 150 190 \
            --app-drop-link 450 185 \
            "dist/${{ matrix.asset_name }}.dmg" \
            "dist/BetterFlow.app"

      # Submit the signed DMG to Apple's notary service and staple the ticket
      # so Gatekeeper trusts it offline on first launch. Same gate as signing:
      # no-op without the cert secret, REQUIRED on tagged releases. notarytool
      # reads BF_NOTARY_* creds via scripts/notarize-mac.py (CI has no stored
      # keychain profile).
      - name: Notarize and staple macOS DMG
        if: runner.os == 'macOS'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          BF_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          BF_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          BF_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          DMG="dist/${{ matrix.asset_name }}.dmg"
          if [ -z "${MACOS_CERT_P12_BASE64:-}" ]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::macOS signing secrets not set — refusing to ship an un-notarized tagged release."
              exit 1
            fi
            echo "macOS signing secrets not set — skipping notarization."
            exit 0
          fi
          if [ -z "${BF_NOTARY_APPLE_ID:-}" ] || [ -z "${BF_NOTARY_TEAM_ID:-}" ] || [ -z "${BF_NOTARY_PASSWORD:-}" ]; then
            echo "::error::Cert present but MACOS_NOTARY_* credentials missing — cannot notarize."
            exit 1
          fi
          python3 scripts/notarize-mac.py "$DMG"
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      - name: Create Windows auto-update ZIP
        if: matrix.os == 'windows-latest'
        # AUTO-UPDATER ARTIFACT ONLY — not a human download. One-dir build: zip
        # the *contents* of dist\BetterFlow (BetterFlow.exe + _internal\...) at the
        # archive root so the self-updater's `xcopy extract_dir\* app_path\` drops
        # them straight into the install dir. Named "-Update" so users grab the
        # installer instead: a human who opens this zip and double-clicks the loose
        # exe runs a one-dir exe WITHOUT its _internal\python311.dll (Explorer's
        # zip preview extracts only the exe) and it crashes on launch (Sachi,
        # 2026-06-19). update_checker matches "BetterFlow-Windows*.zip" by
        # substring, so the rename is transparent to the deployed fleet.
        run: |
          cd dist/BetterFlow
          Compress-Archive -Path "*" -DestinationPath "../${{ matrix.asset_name }}-Update.zip"

      # Build a real installer so the app registers in Windows "Installed apps"
      # (with an uninstaller) and gets a Start Menu shortcut — a zipped bare exe
      # never does. Per-user install, no admin. Version is read from
      # src/__init__.py and injected into the .iss. This is the PRIMARY Windows
      # artifact (the zip is auto-update-only), so a build failure here is FATAL:
      # never ship a Windows release that offers users only the crash-prone zip.
      - name: Build Windows installer (Inno Setup)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install innosetup -y --no-progress --no-color
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found at $iscc" }
          $ver = (Select-String -Path src/__init__.py -Pattern '__version__\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          Write-Host "Installer version: $ver"
          & $iscc /DMyAppVersion=$ver installer\windows\betterflow.iss
          if (-not (Test-Path "dist\BetterFlow-Windows-Setup.exe")) {
            throw "Installer did not produce dist\BetterFlow-Windows-Setup.exe"
          }
          Get-ChildItem dist\BetterFlow-Windows-Setup.exe

      - name: Create Linux AppImage
        if: runner.os == 'Linux'
        run: |
          chmod +x scripts/build-appimage.sh
          ./scripts/build-appimage.sh "dist/${{ matrix.asset_name }}.AppImage"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            dist/${{ matrix.asset_name }}.dmg
            dist/${{ matrix.asset_name }}-Update.zip
            dist/${{ matrix.asset_name }}-Setup.exe
            dist/${{ matrix.asset_name }}.AppImage
          retention-days: 30

      # Best-effort teardown of the throwaway signing keychain + cert, even on
      # failure. Runners are ephemeral, but leaving the cert key around mid-job
      # is sloppy.
      - name: Clean up signing keychain
        if: always() && runner.os == 'macOS'
        run: |
          security delete-keychain "$RUNNER_TEMP/betterflow-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/betterflow-devid.p12"

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write  # create the GitHub release + upload assets

    steps:
      - name: Download macOS ARM artifact
        uses: actions/download-artifact@v8
        with:
          name: BetterFlow-macOS-arm64
          path: ./artifacts

      - name: Download macOS Intel artifact
        uses: actions/download-artifact@v8
        with:
          name: BetterFlow-macOS-x86_64
          path: ./artifacts

      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: BetterFlow-Windows
          path: ./artifacts

      - name: Download Linux artifact
        uses: actions/download-artifact@v8
        with:
          name: BetterFlow-linux-x86_64
          path: ./artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/BetterFlow-macOS-arm64.dmg
            artifacts/BetterFlow-macOS-x86_64.dmg
            artifacts/BetterFlow-Windows-Update.zip
            artifacts/BetterFlow-Windows-Setup.exe
            artifacts/BetterFlow-linux-x86_64.AppImage
          # Steer Windows users to the installer. The -Update.zip is consumed by
          # the in-app auto-updater only; running its loose exe from inside the
          # archive crashes (missing _internal\). macOS = .dmg, Linux = .AppImage.
          body: |
            ### Downloads
            - **Windows:** download **BetterFlow-Windows-Setup.exe** and run it (per-user install, no admin). Do **not** download the `-Update.zip` — that file is only used by the app's built-in auto-updater.
            - **macOS:** `BetterFlow-macOS-<arch>.dmg`
            - **Linux:** `BetterFlow-linux-x86_64.AppImage`
          # Channel-aware publishing, keyed off the '-' in the tag name:
          #   v1.5.62        (stable)  -> draft, NOT prerelease  (manual publish
          #                              gates the all-users / `stable` rollout)
          #   v1.5.62-beta.1 (beta/rc) -> published prerelease    (delivered to
          #                              the in-app `beta`/`canary` channels for
          #                              the dev team; never seen by `stable`)
          # See update_checker._matches_channel for the consuming logic.
          prerelease: ${{ contains(github.ref_name, '-') }}
          draft: ${{ !contains(github.ref_name, '-') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
